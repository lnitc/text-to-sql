# ============================================================================
# TEXT-TO-SQL AGENTIC DATA ANALYST - Docker Compose Configuration
# ============================================================================
# Local development orchestration for backend (FastAPI) and frontend (Next.js)
#
# Usage:
#   docker-compose up --build          # Build and start all services
#   docker-compose up                  # Start without rebuilding
#   docker-compose down                # Stop all services
#   docker-compose logs -f backend     # View backend logs
#   docker-compose logs -f frontend    # View frontend logs
# ============================================================================

services:
  # =========================================================================
  # BACKEND SERVICE - FastAPI + CrewAI + BigQuery
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: text-to-sql-backend
    ports:
      - "8000:8000"
    environment:
      # OpenAI Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-2000}
      
      # GCP Configuration
      # Must match the container path of the key mounted under volumes below
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-key.json
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      BQ_QUERY_TIMEOUT_SECONDS: ${BQ_QUERY_TIMEOUT_SECONDS:-30}
      BQ_MAX_RESULTS_ROWS: ${BQ_MAX_RESULTS_ROWS:-1000}
      BQ_MAX_BYTES_BILLED: ${BQ_MAX_BYTES_BILLED:-10737418240}
      
      # Pipeline selection (simple | crew) and CrewAI telemetry opt-out
      PIPELINE_MODE: ${PIPELINE_MODE:-simple}
      CREWAI_DISABLE_TELEMETRY: ${CREWAI_DISABLE_TELEMETRY:-true}

      # FastAPI Configuration
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_REQUEST_LOGGING: ${ENABLE_REQUEST_LOGGING:-true}
    
    volumes:
      # Mount GCP service account key (read-only)
      # On Windows: use full path or relative path to the gcp-key.json file
      - ./gcp-key.json:/secrets/gcp-key.json:ro
      # Mount source code for hot-reload during development
      - ./backend:/app
      # Exclude venv and __pycache__ from sync
      - /app/venv
      - /app/__pycache__
    
    networks:
      - app-network
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # Restart policy
    restart: unless-stopped
    
    # Resource limits (optional, for production)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M

  # =========================================================================
  # FRONTEND SERVICE - Next.js 16
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* values are inlined into the browser bundle at build
      # time, so changing them requires `docker compose up --build`
      args:
        # Called from the user's browser, so it must be a host-reachable URL
        # (the "backend" hostname only resolves inside the Docker network)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-development}
    container_name: text-to-sql-frontend
    ports:
      - "3000:3000"
    # No source bind mount: the image runs its own production build. For
    # hot reload, run `npm run dev` in frontend/ instead.

    networks:
      - app-network
    
    # Depends on backend being ready
    depends_on:
      backend:
        condition: service_healthy
    
    # Health check
    healthcheck:
      # The slim Node image has no curl, so use Node's built-in fetch
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Restart policy
    restart: unless-stopped
    
    # Resource limits (optional, for production)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.25'
    #       memory: 256M

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  app-network:
    driver: bridge

# ============================================================================
# VOLUMES (Optional for persistent data)
# ============================================================================
# volumes:
#   backend-cache:
#   frontend-build:

# ============================================================================
# NOTES FOR DEVELOPERS
# ============================================================================
# 1. Before running docker-compose:
#    - Copy .env.example to .env.local
#    - Fill in OPENAI_API_KEY, GCP_PROJECT_ID, GCP_KEY_PATH
#    - Ensure gcp-key.json exists at the path specified in GCP_KEY_PATH
#
# 2. Initial setup:
#    docker-compose up --build
#
# 3. Subsequent runs (without code changes):
#    docker-compose up
#
# 4. View logs:
#    docker-compose logs -f backend
#    docker-compose logs -f frontend
#
# 5. Access services:
#    Frontend: http://localhost:3000
#    Backend API: http://localhost:8000
#    Backend Docs: http://localhost:8000/docs
#
# 6. Stop services:
#    docker-compose down
#
# 7. Rebuild after dependency changes:
#    docker-compose down && docker-compose up --build
# ============================================================================
